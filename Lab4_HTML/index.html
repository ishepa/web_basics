<!DOCTYPE html>
<html>
  <head>
    <title>Лабораторна робота № 4</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div id="app"></div>
    <form action="https://httpbin.org/post" method="post">
      <label for="username">Ваше ім'я:</label>
      <input
        type="text"
        id="user_name"
        name="user_name"
        placeholder="Введіть
      ім'я"
      />

      <label>
        Дата народження:
        <input type="date" name="birth_date" />
      </label>

      <label for="email">Електронна пошта:</label>
      <input
        type="email"
        id="user_email"
        name="user_email"
        placeholder="example@gmail.com"
      />

      <lable for="message">Розкажіть про себе:</lable>
      <textarea
        id="message"
        name="user_message"
        rows="5"
        placeholder="Введіть текст:"
      ></textarea>

      <h2>Ваші любимі напої?</h2>
      <div class="options">
        <lable>
          <input type="checkbox" name="coffee" value="Так" />
          Кава
        </lable>

        <label>
          <input type="checkbox" name="tea" value="Так" />
          Чай
        </label>

        <lable>
          <input type="checkbox" name="juice" value="Так" />
          Сік
        </lable>

        <lable>
          <input type="checkbox" name="water" value="Так" />
          Вода
        </lable>
      </div>

      <h2>Моя національність</h2>

      <div class="options">
        <label>
          <input type="radio" name="nationality" value="Українець">
          Українець
        </label>

        <lable>
          <input type="radio" name="nationality" value="Поляк">
          Поляк
        </lable>

        <label>
          <input type="radio" name="nationality" value="Інше">
          Інша
        </label>

        <button type="submit">Відправити</button>
        <button type="reset">Очистити</button>
    </form>

    <picture>
      <source media="(max-width: 468px)"
      srcset="https://picsum.photos/300/500">

      <img src="https://picsum.photos/500/500" alt="Демонстраційне зображення">
    </picture>
  </body>
</html>
